<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Pertama Rifan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #1b2a55, #0b0f1a 60%, #3b1d5a);
    }
    .kartu {
      width: 100%;
      max-width: 420px;
      padding: 35px 30px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #6ee7ff;
      box-shadow: 0 0 25px rgba(110, 231, 255, 0.6);
    }
    h1 {
      margin: 20px 0 8px;
      font-size: 34px;
      background: linear-gradient(90deg, #6ee7ff, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sapaan { color: #c7cde0; line-height: 1.6; }
    h2 { margin: 25px 0 12px; font-size: 18px; color: #6ee7ff; }
    .hobi { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .hobi span {
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(110, 231, 255, 0.12);
      border: 1px solid rgba(110, 231, 255, 0.4);
    }
    .hitung { margin-top: 25px; }
    #angka { font-size: 48px; font-weight: bold; color: #f472b6; }
    button {
      margin-top: 10px;
      padding: 12px 28px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: #0b0f1a;
      background: linear-gradient(90deg, #6ee7ff, #a78bfa);
      transition: 0.3s;
    }
    button:hover { transform: scale(1.08); box-shadow: 0 0 20px #a78bfa; }
    .link { margin-top: 28px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .link a { color: #6ee7ff; text-decoration: none; transition: 0.3s; }
    .link a:hover { color: #f472b6; }
  </style>
</head>
<body>
  <div class="kartu">
    <img src="images.webp" alt="Foto Rifan">
    <h1>Halo, saya Rifan</h1>
    <p class="sapaan">Ini website pertama saya, dibuat dari nol. Saya sedang semangat belajar coding!</p>

    <h2>Hobi Saya</h2>
    <div class="hobi">
      <span>🎮 Bermain game</span>
      <span>🏐 Bermain voli</span>
      <span>📚 Belajar coding</span>
    </div>

    <div class="hitung">
      <div id="angka">0</div>
      <button onclick="tambah()">Klik aku!</button>
    </div>

    <div class="link">
      <a href="index.html.html">← Kembali ke Portofolio</a>
      <a href="https://www.google.com" target="_blank">Buka Google</a>
    </div>
  </div>

  <script>
    let jumlah = 0;
    function tambah() {
      jumlah = jumlah + 1;
      document.getElementById("angka").innerText = jumlah;
    }
  </script>
</body>
</html>
